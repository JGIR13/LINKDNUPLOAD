<!--
    Vista previa de "así se verá en LinkedIn". Los huecos entre llaves
    dobles (más abajo, junto a cada campo) los rellena la app con tus
    datos reales antes de mostrarla — no los borres, pero puedes mover,
    quitar o añadir elementos alrededor de ellos. Estilos en
    static/css/base.css (busca ".li-preview").
-->
<div class="li-preview-label">Así se verá en LinkedIn</div>
<div class="li-preview-card">
    <div class="li-preview-header">
        <div class="li-avatar">{{iniciales}}</div>
        <div>
            <div class="li-name">{{nombre}}</div>
            <div class="li-headline">{{headline}}</div>
            <div class="li-meta">Ahora &nbsp;·&nbsp; 🌐</div>
        </div>
    </div>
    <div class="li-preview-text">{{texto_html}}</div>
    {{img_html}}
    <div class="li-preview-actions">
        <span>👍 Me gusta</span><span>💬 Comentar</span><span>🔁 Repostear</span><span>📤 Enviar</span>
    </div>
</div>
